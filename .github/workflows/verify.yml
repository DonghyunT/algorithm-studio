name: Verify branch
on:
  pull_request:
  push:
    branches: ['main', 'codex/**']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/check.cjs
      - run: node --test tests/*.test.cjs
